name: Deploy atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository_visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out atlas
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static atlas
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /ggbo-spatial-atlas
          SITE_ORIGIN: https://ysun-8.github.io
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
